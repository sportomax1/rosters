<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCAA Basketball 10 Roster Table</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>NCAA Basketball 10 Roster Table</h1>

    <section class="controls">
      <label class="upload">
        Upload one or more SYS-DATA files
        <input id="files" type="file" multiple>
      </label>
      <label>
        Search table
        <input id="search" type="search" placeholder="Player, file, school, rating...">
      </label>
      <button id="clear" type="button">Clear</button>
    </section>

    <p id="status">No files loaded.</p>

    <div class="table-wrap">
      <table id="rosterTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr><td>No roster data loaded.</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
